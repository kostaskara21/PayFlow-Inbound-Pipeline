server.port=8081
spring.application.name=my-payment-example

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


#DB
spring.datasource.url=jdbc:postgresql://localhost:5429/payment
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hide the "has not been transferred to the existing local file" warning for files already in downloads
logging.level.org.springframework.integration.sftp.inbound.SftpInboundFileSynchronizer=ERROR


